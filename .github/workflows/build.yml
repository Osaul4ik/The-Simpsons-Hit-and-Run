name: Build VPK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      log:
        description: Write debug output to ux0:data/simpsons/log.txt
        type: boolean
        default: true
      heap_mb:
        description: Newlib heap size in MB (the app has 368 MB in extended memory mode)
        type: string
        default: '192'

jobs:
  build:
    name: Build VPK (${{ matrix.region }})
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    strategy:
      fail-fast: false
      matrix:
        region: [ NTSC, PAL ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The art folder is ignored by git (game data) but vita_create_vpk
      # requires it to exist, since it is packed into the VPK.
      - name: Prepare art directory
        run: mkdir -p art

      # The FFmpeg from vitasdk/vdpm has no Theora decoder, so the .rmv movies
      # cannot be played with it. Build our own (cached between runs).
      - name: Cache FFmpeg (Theora)
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-vita
          key: ffmpeg-vita-${{ hashFiles('scripts/build-ffmpeg-vita.sh') }}

      - name: Build FFmpeg with Theora
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-vita.sh "$GITHUB_WORKSPACE/ffmpeg-vita"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSRR2_FFMPEG_PREFIX="$GITHUB_WORKSPACE/ffmpeg-vita" \
            -DSRR2_REGION=${{ matrix.region }} \
            -DSRR2_LOG=${{ (github.event_name == 'workflow_dispatch' && !inputs.log) && 'OFF' || 'ON' }} \
            -DSRR2_VITA_HEAP_MB=${{ inputs.heap_mb || '192' }} \
            -DSRR2_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Locate VPK
        id: vpk
        run: |
          VPK="$(find build -maxdepth 1 -name '*.vpk' | head -n 1)"
          test -n "$VPK"
          echo "path=$VPK" >> "$GITHUB_OUTPUT"

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-${{ matrix.region }}-vpk
          path: ${{ steps.vpk.outputs.path }}
          if-no-files-found: error

      # The unstripped ELF is needed to symbolicate a Vita crash dump
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-${{ matrix.region }}-elf
          path: build/code/SRR2
          retention-days: 7
          if-no-files-found: warn