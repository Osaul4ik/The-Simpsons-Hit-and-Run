name: Build VPK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      region:
        description: Region to build
        type: choice
        options:
          - both
          - NTSC
          - PAL
        default: both
      log:
        description: Write debug output to ux0:data/simpsons/log.txt
        type: boolean
        default: true
      lto:
        description: Link time optimization (turn off if the link fails)
        type: boolean
        default: true
      heap_mb:
        description: Newlib heap size in MB (the app has 368 MB in extended memory mode; the GXM backend also takes an 80 MB GPU-readable block and nearly all of the 128 MB VRAM)
        type: string
        default: '192'

jobs:
  regions:
    name: Select regions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - name: Pick regions
        id: pick
        run: |
          case "${{ inputs.region || 'both' }}" in
            NTSC) list='["NTSC"]' ;;
            PAL)  list='["PAL"]' ;;
            *)    list='["NTSC","PAL"]' ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: regions
    name: Build VPK (${{ matrix.region }})
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The art folder (Vita-adapted frontend p3d files, taken from the original VPK) is
      # game data: it is NOT stored in this repo. It lives in the private repo
      # Osaul4ik/simpsons_art and is fetched with a read-only deploy key whose private
      # half is stored in the repo secret ART_DEPLOY_KEY.
      - name: Fetch art directory (private repo)
        env:
          ART_DEPLOY_KEY: ${{ secrets.ART_DEPLOY_KEY }}
        run: |
          test -n "$ART_DEPLOY_KEY" || { echo "::error::Secret ART_DEPLOY_KEY is not set"; exit 1; }
          command -v ssh >/dev/null || { apt-get update -qq && apt-get install -y -qq openssh-client; }
          # Do not use ~/.ssh: in the container ssh reads the passwd home (/root), not $HOME
          KEYDIR="$(mktemp -d)"
          printf '%s\n' "$ART_DEPLOY_KEY" > "$KEYDIR/key"
          chmod 600 "$KEYDIR/key"
          ssh-keyscan github.com > "$KEYDIR/known_hosts" 2>/dev/null
          test -s "$KEYDIR/known_hosts" || { echo "::error::ssh-keyscan github.com failed"; exit 1; }
          GIT_SSH_COMMAND="ssh -i $KEYDIR/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$KEYDIR/known_hosts" \
            git clone --depth 1 git@github.com:Osaul4ik/simpsons_art.git /tmp/assets
          rm -rf "$KEYDIR"
          if [ -d /tmp/assets/art ]; then cp -r /tmp/assets/art art; \
          else mkdir art && cp -r /tmp/assets/. art/ && rm -rf art/.git; fi
          test -d art/frontend/scrooby

      # The FFmpeg from vitasdk/vdpm has no Theora decoder, so the .rmv movies
      # cannot be played with it. Build our own (cached between runs).
      - name: Cache FFmpeg (Theora)
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-vita
          key: ffmpeg-vita-${{ hashFiles('scripts/build-ffmpeg-vita.sh') }}

      # The script returns immediately if a complete build is already in the cache
      - name: Build FFmpeg with Theora
        run: bash scripts/build-ffmpeg-vita.sh "$GITHUB_WORKSPACE/ffmpeg-vita"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSRR2_P3D_PDDI=GXM \
            -DSRR2_USE_VITAGL=OFF \
            -DSRR2_FFMPEG_PREFIX="$GITHUB_WORKSPACE/ffmpeg-vita" \
            -DSRR2_REGION=${{ matrix.region }} \
            -DSRR2_LOG=${{ (github.event_name == 'workflow_dispatch' && !inputs.log) && 'OFF' || 'ON' }} \
            -DSRR2_VITA_HEAP_MB=${{ inputs.heap_mb || '192' }} \
            -DSRR2_LTO=${{ (github.event_name == 'workflow_dispatch' && !inputs.lto) && 'OFF' || 'ON' }} \
            -DSRR2_BUILD_TESTS=OFF

      - name: Build
        run: |
          # vita-elf-create fails when the text segment ends within ~4.6 KB below a 64 KB boundary
          # (see code/main/vitatextpad.cpp). Changing the pad size moves the end of the segment;
          # only one object is recompiled and the executable is relinked.
          ok=0
          for pad in 8192 24576 40960 57344; do
            echo "::group::Build with SRR2_VITA_TEXT_PAD=$pad"
            cmake -S . -B build -DSRR2_VITA_TEXT_PAD=$pad
            if cmake --build build --parallel "$(nproc)"; then ok=1; echo '::endgroup::'; break; fi
            echo '::endgroup::'
            echo "::warning::Build failed with SRR2_VITA_TEXT_PAD=$pad, retrying with another pad size"
          done
          if [ "$ok" != 1 ]; then
            echo "::error title=LOAD segments::$(arm-vita-eabi-readelf -lW build/code/SRR2 | grep -E 'LOAD|Type' | sed 's/$/%0A/' | tr -d '\n')"
            exit 2
          fi


      # Guard against silently falling back to the desktop-GL-over-vitaGL backend.
      # vitaGL symbols (vglInit) are NOT a valid signal: vitasdk's SDL2 links vitaGL itself.
      - name: Check the native GXM backend is linked
        run: |
          arm-vita-eabi-nm -C build/code/SRR2 > /tmp/syms.txt
          grep -q 'gxmDisplay' /tmp/syms.txt \
            || { echo "::error::GXM backend missing from the ELF"; exit 1; }
          if grep -q 'pglDisplay' /tmp/syms.txt; then
            echo "::error::GL backend (pglDisplay) is linked: the build did not use GXM"; exit 1
          fi

      - name: Check Theora decoder is linked
        run: |
          arm-vita-eabi-nm build/code/SRR2 | grep -q ff_theora_decoder \
            || { echo "::error::Theora decoder missing: the stock vitasdk FFmpeg was linked"; exit 1; }

      - name: Locate VPK
        id: vpk
        run: |
          VPK="$(find build -maxdepth 1 -name '*.vpk' | head -n 1)"
          test -n "$VPK"
          echo "path=$VPK" >> "$GITHUB_OUTPUT"

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-${{ matrix.region }}-vpk
          path: ${{ steps.vpk.outputs.path }}
          if-no-files-found: error

      # The unstripped ELF is needed to symbolicate a Vita crash dump
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons-${{ matrix.region }}-elf
          path: build/code/SRR2
          retention-days: 7
          if-no-files-found: warn